# Développer UN service avec ton code, le reste restant les images publiées.
# Copier en docker-compose.override.yml (ignoré par git): Compose le charge automatiquement.
# Les chemins supposent les dépôts côte à côte (../../Core_API depuis ce dossier) — adapter.
#
# Rechargement à chaud: `docker compose up --build --watch` (develop.watch ci-dessous).

services:
  # --- Core API (Rust): remplace l'image publiée par le build de développement du dépôt ---
  core-api:
    image: !reset null
    build:
      context: ../../Core_API
      dockerfile: development.Dockerfile
    develop:
      watch:
        - action: sync
          path: ../../Core_API/src
          target: /usr/src/core/src
        - action: sync
          path: ../../Core_API/Cargo.toml
          target: /usr/src/core/Cargo.toml

